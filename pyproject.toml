[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "corum"
version = "0.1.0"
description = "Evidence-aware, dependence-aware consensus among imperfect reviewers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.15",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
quality = [
    "mypy>=1.14",
    "ruff>=0.9",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["corum"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"

[tool.mypy]
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/corum"]
